<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P1 - 封面</title>
<script src="https://cdn.digitalhumanai.top/slidagent/pptx-craft/assets/vendors/tailwind.js"></script>
<link href="https://cdn.digitalhumanai.top/slidagent/pptx-craft/assets/css/fonts.css" rel="stylesheet" />
<link href="https://cdn.digitalhumanai.top/slidagent/pptx-craft/assets/vendors/fontawesome/css/all.min.css" rel="stylesheet" />
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        parchment: "#f5f4ed",
        ivory: "#faf9f5",
        terracotta: "#c96442",
        coral: "#d97757",
        nearBlack: "#141413",
        darkSurface: "#30302e",
        oliveGray: "#5e5d59",
        stoneGray: "#87867f",
        charcoalWarm: "#4d4c48",
        warmSand: "#e8e6dc",
        borderCream: "#f0eee6",
        borderWarm: "#e8e6dc",
        warmSilver: "#b0aea5",
      },
      fontFamily: {
        serif: ["Georgia", "serif"],
        sans: ["Arial", "sans-serif"],
      },
    },
  },
};
</script>
<style type="text/tailwindcss">
@layer utilities {
  .ppt-slide {
    @apply relative w-[1280px] h-[720px] mx-auto box-border overflow-hidden;
  }
  .ppt-slide *, .ppt-slide *::before, .ppt-slide *::after {
    @apply box-border;
    max-width: 100%;
  }
  .ppt-slide img, .ppt-slide video, .ppt-slide canvas, .ppt-slide svg {
    @apply max-w-full max-h-full object-contain;
  }
  .content-safe {
    @apply w-[1220px] h-[660px] my-[30px] mx-auto flex flex-col overflow-hidden;
  }
  .ppt-slide [class*="blur"] { filter: none !important; backdrop-filter: none !important; }
  .ppt-slide [class*="gradient"] { background-image: none !important; }
  .ppt-slide [class*="backdrop-blur"] { backdrop-filter: none !important; }
}
</style>
</head>
<body class="bg-parchment">
<div class="ppt-slide flex flex-col h-[720px] overflow-hidden" type="cover" style="background-color:#f5f4ed;">
  <!-- 背景装饰 -->
  <div class="absolute top-0 left-0 w-full h-full" style="z-index:0;">
    <div class="absolute top-[40px] right-[60px] w-[280px] h-[280px] rounded-full" style="background-color:#e8e6dc;opacity:0.5;"></div>
    <div class="absolute bottom-[30px] left-[40px] w-[200px] h-[200px] rounded-full" style="background-color:#f0eee6;opacity:0.6;"></div>
    <div class="absolute top-[60px] left-[20px] w-[3px] h-[600px]" style="background-color:#c96442;opacity:0.15;"></div>
  </div>

  <div class="content-safe relative" style="z-index:1;padding-left:60px;">
    <!-- 顶部标签 -->
    <div class="flex items-center gap-3 mb-[20px]">
      <div class="w-[40px] h-[2px]" style="background-color:#c96442;"></div>
      <span class="text-[12px] tracking-[0.3em] uppercase font-sans" style="color:#87867f;">保研面试展示 · 2026</span>
    </div>

    <!-- 主标题区 -->
    <div class="flex-1 flex flex-col justify-center min-h-0">
      <h1 class="font-serif text-[64px] font-medium leading-[1.05] mb-[8px]" style="color:#141413;">王宇飞</h1>
      <p class="font-sans text-[20px] leading-[1.6] mb-[40px]" style="color:#5e5d59;">华东师范大学 · 软件工程</p>

      <!-- 核心方向标签 -->
      <div class="flex flex-wrap gap-3 mb-[40px]">
        <div class="flex items-center gap-2 px-[16px] py-[8px] rounded-[8px]" style="background-color:#faf9f5;box-shadow:0 0 0 1px #f0eee6;">
          <i class="fa-solid fa-diagram-project text-[14px]" style="color:#c96442;"></i>
          <span class="font-sans text-[14px]" style="color:#4d4c48;">图神经网络医疗AI</span>
        </div>
        <div class="flex items-center gap-2 px-[16px] py-[8px] rounded-[8px]" style="background-color:#faf9f5;box-shadow:0 0 0 1px #f0eee6;">
          <i class="fa-solid fa-shield-halved text-[14px]" style="color:#c96442;"></i>
          <span class="font-sans text-[14px]" style="color:#4d4c48;">视觉语言模型安全</span>
        </div>
      </div>

      <!-- 联系信息 -->
      <div class="grid grid-cols-2 gap-x-[40px] gap-y-[12px]">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-envelope text-[14px]" style="color:#87867f;"></i>
          <span class="font-sans text-[14px]" style="color:#5e5d59;">flyswxf@gmail.com</span>
        </div>
        <div class="flex items-center gap-3">
          <i class="fa-brands fa-github text-[14px]" style="color:#87867f;"></i>
          <span class="font-sans text-[14px]" style="color:#5e5d59;">github.com/flyswxf</span>
        </div>
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-id-card text-[14px]" style="color:#87867f;"></i>
          <span class="font-sans text-[14px]" style="color:#5e5d59;">学号：10235101413</span>
        </div>
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-calendar text-[14px]" style="color:#87867f;"></i>
          <span class="font-sans text-[14px]" style="color:#5e5d59;">2023.09 - 2027.07</span>
        </div>
      </div>
    </div>

    <!-- 底部装饰线 -->
    <div class="flex items-center gap-4 mt-auto">
      <div class="flex-1 h-[1px]" style="background-color:#e8e6dc;"></div>
      <span class="font-sans text-[10px] tracking-[0.2em] uppercase" style="color:#b0aea5;">ECNU · Software Engineering</span>
      <div class="flex-1 h-[1px]" style="background-color:#e8e6dc;"></div>
    </div>
  </div>
</div>
</body>
</html>
