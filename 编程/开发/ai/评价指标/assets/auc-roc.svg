<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">ROC 曲线示意图</title>
  <desc id="desc">展示 ROC 曲线、随机分类器对角线和 AUC-ROC 阴影面积的示意图</desc>
  <defs>
    <linearGradient id="rocFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0.15" />
    </linearGradient>
    <style>
      .bg { fill: #ffffff; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .axis { stroke: #111827; stroke-width: 2.2; }
      .curve { fill: none; stroke: #16a34a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .diag { stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 8 6; }
      .area { fill: url(#rocFill); stroke: none; }
      .tick { fill: #4b5563; font-size: 14px; font-family: Arial, "Microsoft YaHei", sans-serif; }
      .label { fill: #111827; font-size: 16px; font-weight: 700; font-family: Arial, "Microsoft YaHei", sans-serif; }
      .title { fill: #111827; font-size: 24px; font-weight: 700; font-family: Arial, "Microsoft YaHei", sans-serif; }
      .note { fill: #374151; font-size: 15px; font-family: Arial, "Microsoft YaHei", sans-serif; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="460" rx="20" />

  <text class="title" x="380" y="40" text-anchor="middle">ROC 曲线与 AUC-ROC</text>

  <line class="grid" x1="100" y1="60" x2="660" y2="60" />
  <line class="grid" x1="100" y1="140" x2="660" y2="140" />
  <line class="grid" x1="100" y1="220" x2="660" y2="220" />
  <line class="grid" x1="100" y1="300" x2="660" y2="300" />
  <line class="grid" x1="100" y1="380" x2="660" y2="380" />
  <line class="grid" x1="100" y1="60" x2="100" y2="380" />
  <line class="grid" x1="212" y1="60" x2="212" y2="380" />
  <line class="grid" x1="324" y1="60" x2="324" y2="380" />
  <line class="grid" x1="436" y1="60" x2="436" y2="380" />
  <line class="grid" x1="548" y1="60" x2="548" y2="380" />
  <line class="grid" x1="660" y1="60" x2="660" y2="380" />

  <path class="area" d="M100 380 L122 268 L156 194 L201 143 L268 111 L352 89 L447 73 L548 65 L660 60 L660 380 Z" />
  <line class="diag" x1="100" y1="380" x2="660" y2="60" />
  <path class="curve" d="M100 380 L122 268 L156 194 L201 143 L268 111 L352 89 L447 73 L548 65 L660 60" />

  <circle cx="100" cy="380" r="4.5" fill="#16a34a" />
  <circle cx="122" cy="268" r="4.5" fill="#16a34a" />
  <circle cx="156" cy="194" r="4.5" fill="#16a34a" />
  <circle cx="201" cy="143" r="4.5" fill="#16a34a" />
  <circle cx="268" cy="111" r="4.5" fill="#16a34a" />
  <circle cx="352" cy="89" r="4.5" fill="#16a34a" />
  <circle cx="447" cy="73" r="4.5" fill="#16a34a" />
  <circle cx="548" cy="65" r="4.5" fill="#16a34a" />
  <circle cx="660" cy="60" r="4.5" fill="#16a34a" />

  <line class="axis" x1="100" y1="380" x2="680" y2="380" />
  <line class="axis" x1="100" y1="400" x2="100" y2="40" />
  <polygon points="680,380 668,374 668,386" fill="#111827" />
  <polygon points="100,40 94,52 106,52" fill="#111827" />

  <text class="label" x="388" y="425" text-anchor="middle">False Positive Rate</text>
  <text class="label" x="32" y="222" transform="rotate(-90 32 222)" text-anchor="middle">True Positive Rate</text>

  <text class="tick" x="100" y="402" text-anchor="middle">0.0</text>
  <text class="tick" x="212" y="402" text-anchor="middle">0.2</text>
  <text class="tick" x="324" y="402" text-anchor="middle">0.4</text>
  <text class="tick" x="436" y="402" text-anchor="middle">0.6</text>
  <text class="tick" x="548" y="402" text-anchor="middle">0.8</text>
  <text class="tick" x="660" y="402" text-anchor="middle">1.0</text>

  <text class="tick" x="82" y="385" text-anchor="end">0.0</text>
  <text class="tick" x="82" y="305" text-anchor="end">0.25</text>
  <text class="tick" x="82" y="225" text-anchor="end">0.50</text>
  <text class="tick" x="82" y="145" text-anchor="end">0.75</text>
  <text class="tick" x="82" y="65" text-anchor="end">1.0</text>

  <rect x="456" y="82" width="176" height="78" rx="12" fill="#f0fdf4" stroke="#bbf7d0" />
  <text class="label" x="476" y="112">AUC-ROC = 0.90</text>
  <text class="note" x="476" y="136">越靠近左上角越好</text>

  <text class="note" x="450" y="206">随机分类器基线</text>
  <text class="note" x="118" y="357">高阈值</text>
  <text class="note" x="604" y="84">低阈值</text>
</svg>
